<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleartrip Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 340px;
            min-height: 420px;
            max-height: 560px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            color: #fff;
            overflow-y: auto;
            margin: 0;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .header {
            text-align: center;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #FF8A50 0%, #EC661F 100%);
            border-radius: 10px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(236, 102, 31, 0.25);
        }

        .logo::before {
            content: "CT";
            font-size: 14px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        h1 {
            color: #EC661F;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .subtitle {
            color: #aaa;
            font-size: 12px;
            margin-top: 4px;
        }

        .status-message {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.4;
            border: 1px solid transparent;
        }

        .status-info {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .status-success {
            background: rgba(76, 175, 80, 0.12);
            color: #9BE59F;
            border-color: rgba(76, 175, 80, 0.25);
        }

        .status-error {
            background: rgba(244, 67, 54, 0.12);
            color: #FF9E97;
            border-color: rgba(244, 67, 54, 0.25);
        }

        .input-label {
            display: block;
            color: #EC661F;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 2px solid #333;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: #fff;
        }

        input:focus {
            outline: none;
            border-color: #EC661F;
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: #888;
        }

        .icon-btn {
            width: 42px;
            padding: 0;
            border: 2px solid #EC661F;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #EC661F;
            font-size: 14px;
            cursor: pointer;
        }

        .icon-btn:hover {
            background: #EC661F;
            color: #fff;
        }

        .environment-badges {
            display: flex;
            gap: 4px;
        }

        .badge {
            flex: 1;
            text-align: center;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.55;
            transition: opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .badge.active {
            opacity: 1;
            box-shadow: 0 0 0 1px currentColor;
        }

        .badge-prod {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .badge-qa {
            background: rgba(236, 102, 31, 0.15);
            color: #FF8A50;
            border: 1px solid rgba(236, 102, 31, 0.3);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF8A50 0%, #EC661F 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #EC661F 0%, #D4541A 100%);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #EC661F;
            border: 2px solid #EC661F;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #EC661F;
            color: white;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            margin: 4px 0;
        }

        .divider::after {
            content: 'OR';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: #EC661F;
            padding: 0 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .history-label {
            font-size: 11px;
            color: #ddd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-open-btn {
            border: 1px solid rgba(236, 102, 31, 0.5);
            background: transparent;
            color: #FF8A50;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .history-open-btn:hover {
            background: rgba(236, 102, 31, 0.15);
        }

        .history-empty {
            font-size: 11px;
            color: #777;
            padding: 4px 0;
        }

        .shortcut-hint {
            font-size: 10px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <h1>Cleartrip Stats</h1>
            <div class="subtitle">Itinerary Analytics</div>
        </div>

        <div id="statusMessage" class="status-message status-info" hidden></div>

        <div class="input-section">
            <label class="input-label" for="itineraryInput">Itinerary ID</label>
            <div class="input-row">
                <input type="text" id="itineraryInput" placeholder="Enter your itinerary ID">
                <button id="copyIdButton" class="icon-btn" type="button" title="Copy itinerary ID">⧉</button>
            </div>
        </div>

        <div class="environment-badges">
            <div id="prodBadge" class="badge badge-prod">Production</div>
            <div id="qaBadge" class="badge badge-qa">QA Environment</div>
        </div>

        <div class="button-group">
            <button id="statsCorpButton" class="btn btn-primary" type="button">Open Prod</button>
            <button id="statsSaButton" class="btn btn-primary" type="button">Open QA</button>
        </div>

        <div class="divider"></div>

        <button id="statsButton" class="btn btn-secondary" type="button">Stats from URL</button>
        <div class="shortcut-hint">Shortcut: Ctrl+Shift+S · Right-click page → Open Stats from URL</div>

        <div class="history-section">
            <div class="section-title">Recent</div>
            <ul id="historyList" class="history-list"></ul>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
